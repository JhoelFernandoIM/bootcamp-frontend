<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript + DOM: Key event detect</title>
    <style>
        #tecla {
            color: orangered;
            font-size: 32px;
        }
        #caracter {
            color: blue;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <h1>Javascript + DOM: Key event detect</h1>

    <main>
        <h2>Javascript + DOM: Key event detect</h2>

        <h3 id="tecla">0</h3>

        <h4 id="caracter">A</h4>
    </main>

    <script>
        const tecla = document.getElementById('tecla')
        const caracter = document.getElementById('caracter')

        document.addEventListener('keydown', function(event) {
            console.log('Presionaste una tecla')

            console.log({event})
            console.log(event.key)
            console.log(event.keyCode) // código ASCII, otros son UTF8

            tecla.textContent = event.keyCode
            caracter.textContent = event.key
        })

        // console.log({ tecla })
        // console.log(tecla.textContent)

        // //TODO: Leer el valor del elemento h4
        // console.log(caracter)
        // console.log({ caracter })
        // console.log(caracter.textContent)

        // tecla.textContent = "999" //escribiendo sobre los atributos de elemento html

    </script>
        
    
</body>
</html>
